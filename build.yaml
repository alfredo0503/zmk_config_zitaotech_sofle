---
include:
  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackball

  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackpad
    # ZMK Studio over USB: enable only on the split Central (left) side.
    snippet: studio-rpc-usb-uart
    # Locking is disabled so Studio can edit immediately without consuming a key for &studio_unlock.
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_USB_LOGGING=n


    
  - board: zitaotech_sofle_right
    shield: lpm_view;right_trackpoint

  # Dual-BB upgrade: new right-side A320 trackpad target
  - board: zitaotech_sofle_right
    shield: lpm_view;right_bbtrackpad



  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackball;settings_reset
  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackpad;settings_reset
  - board: zitaotech_sofle_right
    shield: lpm_view;right_trackpoint;settings_reset
  - board: zitaotech_sofle_right
    shield: lpm_view;right_bbtrackpad;settings_reset
